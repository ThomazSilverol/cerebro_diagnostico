# =============================================================================
# DEFINIÇÕES NORMATIVAS — Glossário técnico integrado
# Para uso como contexto em prompts de IA e validação de respostas
# =============================================================================
definicoes_normativas:

  # [B] NBR 13752:2024
  nbr_13752_2024:
    anamnese: >
      Etapa da perícia que consiste em estudo histórico do objeto,
      incluindo análise de documentos, histórico de uso e manutenção,
      realizada antes ou durante a vistoria.
    manifestacao_patologica: >
      Irregularidade que se manifesta no produto em função de falhas no projeto,
      na fabricação, na instalação, na execução, na montagem, no uso ou na manutenção,
      bem como problemas que não decorram do envelhecimento natural. (ref. NBR 15575)
    anomalia: >
      Irregularidade, anormalidade, exceção à regra e padrão estabelecido.
    anomalia_endogena: >
      Anomalia associada a projeto, especificações de materiais ou execução.
    anomalia_exogena: >
      Anomalia associada a fatores externos ou provocada por terceiros.
    anomalia_funcional: >
      Anomalia associada ao término da vida útil de projeto, à decrepitude ou à obsolescência.
    vicio_uso: >
      Anomalia ou falha que afeta o desempenho de produtos ou serviços,
      ou os torna inadequados aos fins a que se destinam.
    vicio_construtivo: >
      Anomalia ou falha com origem associada a projeto, especificações de materiais
      ou execução, que afeta o desempenho de produtos ou serviços, ou os torna
      inadequados aos fins a que se destinam.
    vistoria_constatacao: >
      Verificação de fatos ou situações com descrição minuciosa dos elementos.
      Pode caracterizar tipologia, estado de conservação, padrão construtivo,
      anomalias, manifestações patológicas. Não determina causas, responsabilidades ou soluções.
    vistoria_analise_causalidade: >
      Vistoria com método investigativo e analítico fundamentado que permite
      apuração de causas. Exige nexo causal fundamentado e classifica responsabilidades.
    vistoria_comparativa_conformidade: >
      Análise comparativa de conformidade entre o estado verificado e os
      requisitos técnicos normativos aplicáveis.
    nexo_causal: >
      Vínculo fático entre efeito (sintoma, anomalia) e causa.
      Pautado na relação efeito × causa com metodologia investigativa técnica.

  # [C] NBR 16747:2020
  nbr_16747_2020:
    anomalia_inspecao: >
      Irregularidade, anormalidade e exceção à regra que ocasionam a perda de desempenho
      da edificação ou suas partes, oriundas da fase de projeto, execução ou final de
      vida útil, além de fatores externos (endógena, funcional ou exógena).
    agentes_degradacao: >
      Tudo aquilo que, ao agir sobre um sistema, contribui para reduzir seu desempenho.
    patamar_prioridade_1: >
      Ações imediatas: perda de desempenho compromete saúde e/ou segurança dos usuários
      e/ou a funcionalidade dos sistemas, com possíveis paralisações, comprometimento
      de durabilidade, vida útil e/ou aumento expressivo de custo de recuperação.
      Equivale ao Grau de Risco Crítico (IBAPE).
    patamar_prioridade_2: >
      Ações em médio prazo: perda parcial de desempenho sem impacto imediato
      sobre funcionalidade. Equivale ao Grau de Risco Médio (IBAPE).
    patamar_prioridade_3: >
      Ações sem urgência: perda de desempenho sem impacto sobre funcionalidade,
      segurança e saúde. Equivale ao Grau de Risco Mínimo (IBAPE).

  # [D] NBR 17170:2022
  nbr_17170_2022:
    prazo_garantia: >
      Período durante o qual um fornecedor assume responsabilidade perante o consumidor
      para corrigir falhas nos produtos por ele fornecidos, originadas no processo de
      concepção e produção, desde que realizada manutenção devida e uso correto.
    garantia_legal: >
      Direito do proprietário de reclamar reparos ou recomposição do produto adquirido,
      conforme legislação vigente (art. 618 CC — 5 anos para solidez e segurança).
    data_inicio_garantia: >
      Data de emissão do auto de conclusão (habite-se) ou documento equivalente
      que ateste a conclusão das obras ou dos serviços.
    prazos_referencia:
      estrutura_vigas_lajes_pilares: "20 anos"
      instalacoes_eletricas_hidraulicas: "5 anos"
      impermeabilizacao: "5 anos"
      revestimentos_externos: "3 anos"
      revestimentos_internos: "1 a 3 anos"
      esquadrias_equipamentos: "1 ano"
      reparos_parciais_minimo: "90 dias"

  # [E] IBAPE/SP 2015 + NBR 13752
  ibape_classificacoes:
    decrepitude: "Deterioração natural e progressiva dos materiais da construção"
    mutilacao: "Dano físico direto provocado intencionalmente ou acidentalmente"
    avaria: "Dano, deterioração ou estragos em elemento construtivo"
    obsoletismo: "Superação tecnológica ou funcional do sistema ou componente"
    grau_risco_critico: >
      Risco que oferece perda de vidas humanas, do meio ambiente ou do
      próprio edifício. Ação imediata necessária. (= Prioridade 1 NBR 16747)
    grau_risco_medio: >
      Risco que provoca ferimentos em pessoas, danos ao meio ambiente ou ao edifício.
      (= Prioridade 2 NBR 16747)
    grau_risco_minimo: >
      Desconfortos, deterioração do meio ambiente ou do edifício, pequenos
      prejuízos financeiros. (= Prioridade 3 NBR 16747)

# =============================================================================
# MÉTODO GUT ADAPTATIVO v5.0
# Calibrado com a literatura técnica [H] (Kepner & Tregoe 1981; Verzola 2014; Böes 2017)
# Correlação: gravidade GUT ↔ criticidade CMB ↔ grau de risco IBAPE ↔ prioridade NBR 16747
# =============================================================================
taxonomia_gut:
  referencia: "Kepner & Tregoe (1981), adaptado por Verzola et al. (2014) e Böes (2017)"

  # Escala de Gravidade (G) — 1 a 5
  gravidade:
    5: "Perda de vidas humanas, do meio ambiente ou do próprio edifício"
    4: "Ferimentos em pessoas, danos ao meio ambiente ou ao edifício"
    3: "Desconfortos, deterioração do meio ambiente ou do edifício"
    2: "Pequenos incômodos ou pequenos prejuízos financeiros"
    1: "Sem gravidade"

  # Escala de Urgência (U) — 1 a 5
  urgencia:
    5: "Evento em ocorrência — necessita ação imediata"
    4: "Evento prestes a ocorrer — prazo muito curto"
    3: "Evento com prognóstico em breve — dias/semanas"
    2: "Evento com prognóstico para adiante — meses"
    1: "Evento com prognóstico distante — sem pressão de tempo"

  # Escala de Tendência (T) — 1 a 5
  tendencia:
    5: "Piora imediatamente sem ação"
    4: "Piora em pouco tempo sem ação"
    3: "Piora em médio prazo sem ação"
    2: "Piora em longo prazo sem ação"
    1: "Não piora e pode melhorar sozinho"

  # Correlação entre métodos — fonte: [H]
  correlacao_metodos:
    gut_gravidade_4_ou_5: "grau de risco crítico (IBAPE) = prioridade 1 (NBR 16747)"
    gut_gravidade_3:      "grau de risco médio (IBAPE) = prioridade 2 (NBR 16747)"
    gut_gravidade_1_ou_2: "grau de risco mínimo (IBAPE) = prioridade 3 (NBR 16747)"

  # Regra especial — fonte: [29] (TJDFT)
  # Se G ≥ 8 ou U ≥ 8, T recebe automaticamente pontuação máxima (10)
  regra_gravidade_urgencia_maxima:
    threshold: 8
    acao: "atribuir T=10 automaticamente"

gut_adaptativo:
  habilitado: true
  threshold_autonomo: 0.80
  threshold_semi_autonomo: 0.50
  casos_minimos_autonomo: 5
  usar_ia_por_padrao: false
  salvar_automatico: false
  decay_180_dias: 0.8
  decay_365_dias: 0.5
  peso_caso_corrigido: 0.3
  peso_projeto_atual: 1.5
  confianca_minima_dimensao: 0.70
  sobreposicao_threshold: 0.15
  sobreposicao_pct_min: 0.50
  shs_habilitado: true
  exigir_nexo_causal: true
  t_minimo_em_ocorrencia: 7
  t_maximo_em_regressao: 2
  desconto_subsistema_diferente: 0.30

  # Mapeamento seções H → subsistemas GUT e normas associadas
  mapa_hierarquia_subsistema:
    "H14 ANOMALIAS E FALHAS DAS EDIFICAÇÕES":
      subsistema: "geral"
      normas: ["NBR 13752:2024", "NBR 16747:2020"]
