      - "tela de ancoragem ausente"
      - "fissura estrutural"
      - "fissura de retração"
      - "fissura por recalque"
      - "umidade de condensação"

  classificacao_ibape:
    boost: 1.5
    # Fonte: [B] NBR 13752:2024 + [E] IBAPE/SP 2015 + [C] NBR 16747:2020
    # Definições exatas NBR 13752:2024:
    #   anomalia endógena: associada a projeto, especificações de materiais ou execução
    #   anomalia exógena: associada a fatores externos ou provocada por terceiros
    #   anomalia funcional: associada ao término da VUP, decrepitude ou obsolescência
    #   vício de uso: anomalia ou falha que afeta o desempenho por uso ou manutenção inadequados
    #   vício construtivo: anomalia ou falha com origem em projeto, materiais ou execução
    termos:
      - "anomalia endógena"
      - "anomalia exógena"
      - "anomalia natural"
      - "anomalia funcional"
      - "vício construtivo"
      - "vícios construtivos"
      - "vício de uso"           # [B] NBR 13752:2024 — novo termo
      - "avaria"
      - "decrepitude"
      - "deterioração"
      - "obsoletismo"            # [E] IBAPE/SP 2015 — superação tecnológica ou funcional
      - "mutilação"              # [E] IBAPE/SP 2015
      - "grau de risco crítico"
      - "grau de risco médio"
      - "grau de risco mínimo"
      - "falha de planejamento"
      - "falha de execução"
      - "falha operacional"
