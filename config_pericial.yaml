# =============================================================================
# config_pericial.yaml — Configuração do Cérebro de Engenharia Diagnóstica
# Versão 5.1 — Enriquecido com pesquisa em normas e artigos técnicos
#
# Fontes desta versão:
#   [A] Banco_Pericial_Multimodal.xlsx (4.373 registros)
#   [B] ABNT NBR 13752:2024 — Perícias de Engenharia na Construção Civil
#   [C] ABNT NBR 16747:2020 — Inspeção Predial (diretrizes, conceitos, terminologia)
#   [D] ABNT NBR 17170:2022 — Garantias de Edificações (prazos e diretrizes)
#   [E] IBAPE/SP Norma Básica de Perícias de Engenharia 2015
#   [F] ABNT NBR 15575-1:2013 — Edificações Habitacionais — Desempenho
#   [G] ABNT NBR 14653-2:2011 — Avaliação de Bens — Imóveis Urbanos
#   [H] Método GUT (Kepner & Tregoe, 1981; adapt. Verzola et al. 2014; Böes 2017)
#   [I] IBAPE/SP — Norma de Inspeção Predial Nacional 2012
#   [J] ABNT NBR 5674:2012 — Manutenção de Edificações
#   [K] ABNT NBR 16280:2015 — Reforma em Edificações
#   [L] ABNT NBR 14037 — Manual de Uso, Operação e Manutenção
#
# Atualizado em: 2026-03
# =============================================================================

# =============================================================================
# SISTEMA
# =============================================================================
sistema:
  modelo_llm: "claude-sonnet-4-6"
  temperatura_rag: 0.1
  provedor: "anthropic"
  versao_config: "5.1"
  banco_referencia: "Banco_Pericial_Multimodal.xlsx"
  norma_pericia_vigente: "ABNT NBR 13752:2024"   # [B] substitui versão 1996
  norma_inspecao_vigente: "ABNT NBR 16747:2020"  # [C]
  norma_garantia_vigente: "ABNT NBR 17170:2022"  # [D]

# =============================================================================
# BANCO MULTIMODAL — Mapeamento das abas reais do banco
# =============================================================================
banco_multimodal:
  abas:
    banco_documental:
      nome: "Banco Documental e Normas"
      colunas: [Arquivo, Tipo, Item, Hierarquia, "Texto Original", "Análise (IA)", "Palavras-Chave"]
      total_linhas_aprox: 4373
      uso: "Fonte primária de trechos normativos e de laudos"

    parametros_normativos:
      nome: "Parâmetros Normativos"
      colunas: [Norma, Tipo, Parâmetro, Valor, Unidade, Item, Pág., Contexto]
      total_linhas_aprox: 1707
      uso: "Valores numéricos extraídos de normas — base para confronto técnico"

    matriz_risco:
      nome: "Matriz de Risco"
      colunas: [Origem, Análise, "Risco (IA)", "Risco (Perito)", "GUT (IA)", "GUT (Perito)", Critério, "Palavras-Chave"]
      uso: "Classificação GUT e risco — preenchida pelo perito após análise"

    quesitos_respondidos:
      nome: "Quesitos Respondidos"
      colunas: ["Laudo Fonte", Sessão, Pergunta, Resposta]
      total_linhas_aprox: 87
      sessoes_conhecidas:
        - "Quesitos Autor"
        - "Quesitos complementares Autor"
        - "Quesitos Réu"
      uso: "Base de respostas a quesitos judiciais"

    textos_manuais:
      nome: "Textos Manuais"
      colunas: [Origem, Tópico, "Texto Original", Análise, "Palavras-Chave"]
      uso: "Textos inseridos manualmente pelo perito"

# =============================================================================
# ARQUIVOS DO BANCO
# =============================================================================
arquivos_indexados:
