      # Patologias clássicas — confirmadas no banco [A]
      - "fissura"
      - "fissuração"
      - "fissuras"
      - "eflorescência"
      - "eflorescências"
      - "infiltração"
      - "infiltrações"
      - "recalque"
      - "recalques"
      - "recalque diferencial"
      - "desplacamento"
      - "desplacamentos"
      - "corrosão"
      - "corrosão de armadura"
      - "carbonatação"
      - "frente de carbonatação"
      - "segregação"
      - "segregações"
      - "umidade ascendente"
      - "umidade descendente"
      - "manchas de umidade"
      - "bolor"
      - "manifestação biológica"
      - "deformação excessiva"
      - "flecha"
      - "desaprumo"
      - "desalinhamento"
      # Patologias do banco real [A]
      - "vazio abaixo do piso"
      - "rebaixamento de piso"
      - "trinca"
      - "rachadura"
      - "mancha"
      - "reparo"
      - "patologia"
      - "sinistro"
      - "aterro inadequado"
      - "recalque de aterro"
      # Novos — NBR 13752:2024 [B] e literatura técnica [H][25]
      - "manifestação patológica"
      - "manifestações patológicas"
      - "não conformidade"
      - "não conformidades"
      - "irregularidade construtiva"
      - "degradação precoce"
      - "perda de desempenho"
      - "perda de estanqueidade"
      - "destacamento cerâmico"
