# =============================================================================
# HIERARQUIAS DE LAUDO — Seções H mapeadas do banco real
# =============================================================================
hierarquias_laudo:
  secoes_tecnicas:
    - "H14 ANOMALIAS E FALHAS DAS EDIFICAÇÕES"
    - "H15 ANOMALIA"
    - "H16 FALHA"
    - "H17 GRAU DE RISCO"
    - "H18 VÍCIO CONSTRUTIVO: CONCEITO, DEFINIÇÃO E CARACTERIZAÇÃO"
    - "H22 MANUTENABILIDADE"
    - "H23 GUARDA CORPO"
    - "H24 MURO DE CONTENÇÃO E MURO PERIFÉRICO"
    - "H25 PISOS E CALÇADAS"
    - "H26 VAZIOS ABAIXO DO PISO"
    - "H27 INFILTRAÇÕES"
    - "H28 LAJE"
    - "H31 COBRIMENTO DAS ARMADURAS"
    - "H32 SEGREGAÇÃO DO CONCRETO"
    - "H33 JANELAS"
    - "H35 TRINCAS E FISSURAS"
    - "H37 QUADROS ELÉTRICOS"
    - "H41 DRENAGEM E INSTALAÇÕES DA CASA DE MÁQUINAS"
    - "H42 SISTEMAS DE DRENAGEM DE ÁGUAS PLUVIAIS"

  secoes_nao_tecnicas:
    - "PRE"
    - "H8 METODOLOGIA"
    - "H12 CARACTERIZAÇÃO DA REGIÃO"
    - "H13 DESCRIÇÃO DO OBJETO PERICIAL"

# =============================================================================
# PALAVRAS-CHAVE v2.0
# =============================================================================
palavras_chave:
  versao_algoritmo: "2.0"
  max_por_topico: 10
  usar_ia_se_disponivel: true
  normalizar_para_canonico: true
  min_length_token: 4
  idf_threshold_stopword: 0.5
  idf_cache_ttl_horas: 24

  boost_tipos_documento:
    norma_abnt: 1.4
    laudo_judicial: 1.3
    livro: 1.1
    parecer_tecnico: 1.1
    norma_iso: 1.0
    norma_outro: 1.0
    artigo: 0.9
    manual_fabricante: 0.9
    outro: 0.8

  secoes_nao_tecnicas:
    - "preambulo"
    - "sumario"
    - "apresentacao"
    - "identificacao das partes"
    - "comunicacao da pericia"
    - "linha do tempo"
    - "introducao"
    - "metodologia"
    - "caracterizacao da regiao"

  termos_tecnicos_adicionais: []
  stopwords_tecnicas_adicionais: []
  termos_canonicos_adicionais: {}

# =============================================================================
# VOCABULÁRIO PERICIAL — Categorias e Boosts (Camada 2)
# v5.1 — Enriquecido com NBR 13752:2024, NBR 16747:2020, NBR 17170:2022
# =============================================================================
vocabulario_pericial:

  patologias:
    boost: 1.4
    # Fonte principal: [A] banco + [B] NBR 13752:2024 + [C] NBR 16747:2020
    # NBR 16747 def.: "anomalia: irregularidade, anormalidade e exceção à regra que
    # ocasionam a perda de desempenho da edificação ou suas partes, oriundas da fase
    # de projeto, execução ou final de vida útil, além de fatores externos"
